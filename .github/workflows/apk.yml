name: APK demo

# Compila la app en GitHub (sin necesitar un PC) y publica el APK para instalarlo en el celular.
on:
  push:
    branches: [demo-nucleo, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas y APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: dones-demo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en "Releases" (link directo para el celular)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo-nucleo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dones-demo.apk
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo dones-demo.apk --prerelease --target "$GITHUB_SHA" \
            --title "Demo · $(date -u +'%Y-%m-%d %H:%M') UTC" \
            --notes "APK del demo, compilado de ${GITHUB_SHA::7}. Ábrelo desde el celular para instalarlo."
